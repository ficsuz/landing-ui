server {
    listen 80;
    server_name _;

    # Enable gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Backend API. The frontend calls a relative /api base, so requests land here.
    # Forward them to the backend as-is: /api/v1/... -> backend /api/v1/...
    # NOTE: change the host:port below if the backend moves.
    location /api {
        proxy_pass http://80.241.214.247:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — every non-/api path serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
