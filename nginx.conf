server {
    listen 80;
    server_name _;

    # Enable gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

    root /usr/share/nginx/html;
    index index.html;

    # SPA only. The frontend calls the backend directly at http://80.241.214.247:5001/api
    # (set via VITE_BASE_API), so this container just serves the built static files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
