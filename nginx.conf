server {
    listen 80;
    server_name _;

    # Enable gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep the path only (/ru/media/ -> /ru/media), never http://host:port.
    absolute_redirect off;

    client_max_body_size 20m;

    # Backend API — same-origin. The SPA uses a relative /api base
    # (VITE_BASE_API=/api), so /api/v1/... requests land here and are forwarded
    # to the backend as-is: /api/v1/... -> backend /api/v1/... . Serving the API
    # same-origin removes CORS and mixed-content problems entirely (and keeps
    # working when the SPA moves to https://fics.uz).
    # NOTE: change the upstream host:port below if the backend moves.
    location /api {
        proxy_pass http://80.241.214.247:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Content-hashed build assets (Vite emits /assets/*.[hash].*) never change,
    # so cache them for a year and skip revalidation.
    location /assets/ {
        # One Cache-Control header only — `expires` would emit a second, duplicate
        # one (nginx appends rather than replaces).
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sitemap / robots: short cache so search engines pick up new deploys.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Pages. The build pre-renders a localized HTML head for every static page in
    # every language (/media -> media.html, /ru/media -> ru/media.html, see
    # build/vite-plugin-seo.ts) so crawlers see the right title/description/hreflang
    # without running JS. Everything else (detail pages, unknown URLs) falls back to
    # the neutral SPA shell spa.html.
    # The HTML must NOT be cached: every deploy changes the hashed asset URLs it
    # references, so stale HTML would load dead bundles. no-cache forces the
    # browser to revalidate it on each load.
    # Every language has its own prefix: /uz/..., /ru/..., /en/... The root and old
    # unprefixed URLs (/media, /events/meetings/5 — e.g. links shared before the
    # prefixes existed) permanently redirect to the Uzbek version, keeping the query.
    location = / {
        return 301 /uz$is_args$args;
    }

    location = /index.html {
        return 301 /uz;
    }

    # Admin panel has no language prefix — plain SPA.
    location /admin {
        add_header Cache-Control "no-cache";
        try_files $uri /spa.html;
    }

    location / {
        # One URL per page: /ru/media/ -> /ru/media (301), so trailing-slash
        # variants never get indexed as duplicates.
        rewrite ^/(.+)/$ /$1 permanent;

        add_header Cache-Control "no-cache";
        try_files $uri $uri.html @page;
    }

    # Not a pre-rendered page or a static file.
    location @page {
        # Unprefixed path -> its /uz/... version.
        if ($uri !~ ^/(uz|ru|en)(/|$)) {
            return 301 /uz$request_uri;
        }
        # Language page that is not pre-rendered (detail pages, unknown URLs):
        # the neutral SPA shell; the router renders it (or its 404).
        add_header Cache-Control "no-cache";
        try_files /spa.html =404;
    }
}
