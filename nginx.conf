server {
    listen 80;
    server_name _;

    # Enable gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Backend API — same-origin. The SPA uses a relative /api base
    # (VITE_BASE_API=/api), so /api/v1/... requests land here and are forwarded
    # to the backend as-is: /api/v1/... -> backend /api/v1/... . Serving the API
    # same-origin removes CORS and mixed-content problems entirely (and keeps
    # working when the SPA moves to https://fics.uz).
    # NOTE: change the upstream host:port below if the backend moves.
    location /api {
        proxy_pass http://80.241.214.247:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Content-hashed build assets (Vite emits /assets/*.[hash].*) never change,
    # so cache them for a year and skip revalidation.
    location /assets/ {
        # One Cache-Control header only — `expires` would emit a second, duplicate
        # one (nginx appends rather than replaces).
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. The HTML shell must NOT be cached: every deploy changes the
    # hashed asset URLs it references, so a stale index.html would load dead
    # bundles. no-cache forces the browser to revalidate it on each load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
